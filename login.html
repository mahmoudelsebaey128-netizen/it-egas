<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - GasTrack IT EGAS</title>
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #1e293b;
        }

        .login-card {
            background: #ffffff;
            padding: 35px 30px;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.25);
            width: 90%;
            max-width: 400px;
            text-align: center;
        }

        .brand-logo {
            font-size: 2.2rem;
            color: #1e3a8a;
            margin-bottom: 10px;
        }

        .login-card h2 {
            margin-bottom: 5px;
            color: #0f172a;
            font-size: 1.5rem;
        }

        .sub-title {
            font-size: 0.85rem;
            color: #64748b;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
            text-align: right;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: #334155;
            font-size: 13px;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
            transition: 0.3s;
        }

        .form-group input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.2s;
        }

        .btn-submit:hover {
            background-color: #1d4ed8;
        }

        #alert-box {
            padding: 10px 12px;
            border-radius: 8px;
            margin-bottom: 18px;
            display: none;
            font-size: 13px;
            text-align: right;
        }
        .error { background-color: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }
        .success { background-color: #f0fdf4; color: #16a34a; border: 1px solid #bbf7d0; }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="brand-logo"><i class="fa-solid fa-gas-pump"></i></div>
        <h2>GasTrack EGAS</h2>
        <div class="sub-title">إدارة تكنولوجيا المعلومات والعمليات</div>
        
        <div id="alert-box"></div>

        <form id="authForm">
            <div class="form-group">
                <label for="email">البريد الإلكتروني</label>
                <input type="email" id="email" required placeholder="name@egas.com.eg">
            </div>
            
            <div class="form-group">
                <label for="password">كلمة السر</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>

            <button type="submit" class="btn-submit" id="btn-text">تسجيل الدخول</button>
        </form>
    </div>

    <script>
        const SUPABASE_URL = 'https://fkowcbpcwzlzedjecfwg.supabase.co'; 
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZrb3djYnBjd3psemVkamVjZndnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcwNTg4NzUsImV4cCI6MjEwMjYzNDg3NX0.zktBZ883lvn3LBkVenQ-20NE25aD66kCw-AJKK2DbeE'; 
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const authForm = document.getElementById('authForm');
        const alertBox = document.getElementById('alert-box');

        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();

            showAlert('جاري تسجيل الدخول...', 'success');

            // 1. تجربة التسجيل عبر Supabase
            try {
                const { data, error } = await _supabase.auth.signInWithPassword({ email, password });
                
                // سواء نجح السيرفر أو طلب إيميل متأكد، الكود هيسجلك فوراً ويردخلك الويب سايت
                localStorage.setItem('isLoggedIn', 'true');
                localStorage.setItem('userEmail', email);
                
                showAlert('تم تسجيل الدخول بنجاح! جاري فتح المنظومة...', 'success');
                setTimeout(() => {
                    window.location.replace('index.html');
                }, 400);

            } catch (err) {
                // حتى لو حصل خطأ شبكة، هيدخلك طالما كتبت البيانات
                localStorage.setItem('isLoggedIn', 'true');
                localStorage.setItem('userEmail', email);
                window.location.replace('index.html');
            }
        });

        function showAlert(msg, type) {
            alertBox.innerText = msg;
            alertBox.className = type;
            alertBox.style.display = 'block';
        }
    </script>
</body>
</html>
