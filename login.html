<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب جديد / تسجيل الدخول</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #7b93f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-card {
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .icon-container {
            font-size: 50px;
            margin-bottom: 15px;
        }

        .title {
            font-size: 24px;
            font-weight: bold;
            color: #2d3748;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 14px;
            color: #a0aec0;
            margin-bottom: 25px;
        }

        .alert-box {
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 20px;
            display: none;
        }

        .alert-error {
            background-color: #fed7d7;
            color: #c53030;
            border: 1px solid #feb2b2;
        }

        .alert-success {
            background-color: #c6f6d5;
            color: #22543d;
            border: 1px solid #9ae6b4;
        }

        .input-group {
            margin-bottom: 18px;
            text-align: right;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            color: #718096;
            margin-bottom: 6px;
        }

        .input-group input {
            width: 100%;
            padding: 12px 15px;
            background-color: #f7fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
            text-align: left;
            direction: ltr;
        }

        .input-group input:focus {
            border-color: #667eea;
            background-color: #fff;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #a3b8ff 0%, #8092f6 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
            margin-top: 10px;
        }

        .btn-submit:hover {
            opacity: 0.9;
        }

        .footer-text {
            margin-top: 20px;
            font-size: 13px;
            color: #a0aec0;
        }

        .footer-text a {
            color: #667eea;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="icon-container">🔒</div>
        <h2 class="title">إنشاء حساب جديد</h2>
        <p class="subtitle">انضم إلى فريقنا الآن</p>

        <!-- صندوق رسائل الخطأ والنجاح -->
        <div id="alertBox" class="alert-box"></div>

        <form id="loginForm">
            <div class="input-group">
                <label for="email">البريد الإلكتروني</label>
                <input 
                    type="email" 
                    id="email" 
                    value="mahmoudelsebaey128@gmail.com" 
                    required 
                    placeholder="example@gmail.com"
                >
            </div>

            <div class="input-group">
                <label for="password">كلمة السر</label>
                <input 
                    type="password" 
                    id="password" 
                    value="123456" 
                    required 
                    placeholder="••••••"
                >
            </div>

            <button type="submit" class="btn-submit">إنشاء الحساب / الدخول</button>
        </form>

        <div class="footer-text">
            لديك حساب بالفعل؟ <a href="#" id="toggleLink">تسجيل الدخول</a>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const emailInput = document.getElementById('email').value.trim();
            const passwordInput = document.getElementById('password').value.trim();
            const alertBox = document.getElementById('alertBox');

            // البيانات المعتمدة للتسجيل الدخول
            const validEmail = "mahmoudelsebaey128@gmail.com";
            const validPassword = "123456";

            // إخفاء صندوق التنبيهات مع كل تجربة جديدة
            alertBox.style.display = 'none';
            alertBox.className = 'alert-box';

            // التحقق من صحة البيانات
            if (emailInput === validEmail && passwordInput === validPassword) {
                alertBox.classList.add('alert-success');
                alertBox.innerText = "تم تسجيل الدخول بنجاح! جاري التحويل...";
                alertBox.style.display = 'block';

                // حفظ الجلسة محلياً في المتصفح
                localStorage.setItem('isLoggedIn', 'true');
                localStorage.setItem('userEmail', emailInput);

                // التوجيه للصفحة الرئيسية للمشروع بعد ثانية واحدة
                setTimeout(() => {
                    window.location.href = "index.html"; // غيّر اسم الصفحة هنا إذا كان اسمها مختلف
                }, 1000);

            } else {
                alertBox.classList.add('alert-error');
                alertBox.innerText = "خطأ: البريد الإلكتروني أو كلمة السر غير صحيحة!";
                alertBox.style.display = 'block';
            }
        });
    </script>
</body>
</html>
