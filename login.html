<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - EGAS IT System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0747a6, #0052cc, #0284c7);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            background: #ffffff;
            width: 100%;
            max-width: 400px;
            padding: 35px 30px;
            border-radius: 12px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.25);
            text-align: center;
        }

        .brand-icon {
            font-size: 42px;
            color: #0052cc;
            margin-bottom: 10px;
        }

        .login-card h2 {
            font-size: 22px;
            color: #172b4d;
            margin-bottom: 5px;
        }

        .login-card p {
            font-size: 13px;
            color: #5e6c84;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
            text-align: right;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: bold;
            color: #172b4d;
            margin-bottom: 6px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            top: 50%;
            right: 12px;
            transform: translateY(-50%);
            color: #6b7280;
        }

        .input-wrapper input {
            width: 100%;
            padding: 10px 38px 10px 12px;
            border: 1px solid #dfe1e6;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            transition: 0.2s;
        }

        .input-wrapper input:focus {
            border-color: #0052cc;
            box-shadow: 0 0 0 2px rgba(0, 82, 204, 0.2);
        }

        .btn-login {
            width: 100%;
            background-color: #0052cc;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }

        .btn-login:hover {
            background-color: #0747a6;
        }

        .error-message {
            color: #ef4444;
            font-size: 12px;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <i class="fa-solid fa-gas-pump brand-icon"></i>
        <h2>EGAS IT Management</h2>
        <p>نظام إدارة وتتبع مهام تكنولوجيا المعلومات</p>

        <form id="login-form" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label>اسم المستخدم</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" id="username" placeholder="أدخل اسم المستخدم" required>
                </div>
            </div>

            <div class="form-group">
                <label>كلمة المرور</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="password" placeholder="أدخل كلمة المرور" required>
                </div>
            </div>

            <button type="submit" class="btn-login">تسجيل الدخول</button>
            <div class="error-message" id="error-msg">بيانات الدخول غير صحيحة! حاول مرة أخرى.</div>
        </form>
    </div>

    <script>
        function handleLogin(e) {
            e.preventDefault();
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();

            if (user === "admin" && pass === "egas123") {
                localStorage.setItem('isLoggedIn', 'true');
                window.location.href = "index.html";
            } else {
                document.getElementById('error-msg').style.display = 'block';
            }
        }

        // توجيه تلقائي لو الجلسة مفعّلة
        if (localStorage.getItem('isLoggedIn') === 'true') {
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
