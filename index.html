<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GasTrack - تطبيق إدارة المشاريع</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.0/dist/confetti.browser.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #2563eb;
            --dark-bg: #0f172a;
            --card-bg: #1e293b;
            --text-primary: #f1f5f9;
            --text-secondary: #cbd5e1;
        }

        body {
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            background-color: var(--dark-bg);
            color: var(--text-primary);
            line-height: 1.6;
        }

        body.light-theme {
            --dark-bg: #f8fafc;
            --card-bg: #ffffff;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
        }

        .container {
            display: grid;
            grid-template-columns: 250px 1fr;
            min-height: 100vh;
            gap: 1px;
            background-color: #334155;
        }

        /* Sidebar */
        .sidebar {
            background-color: var(--card-bg);
            padding: 20px;
            border-right: 1px solid rgba(100, 116, 139, 0.3);
            display: flex;
            flex-direction: column;
            gap: 30px;
            overflow-y: auto;
        }

        .logo {
            font-size: 20px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--primary-color);
        }

        .nav-menu {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .nav-tab {
            padding: 12px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            border: none;
            background: none;
            color: var(--text-secondary);
            text-align: right;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-tab:hover {
            background-color: rgba(37, 99, 235, 0.1);
            color: var(--primary-color);
        }

        .nav-tab.active {
            background-color: rgba(37, 99, 235, 0.2);
            color: var(--primary-color);
            border-left: 4px solid var(--primary-color);
        }

        /* Main Content */
        .main-content {
            padding: 30px;
            overflow-y: auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 28px;
        }

        .header-actions {
            display: flex;
            gap: 15px;
        }

        button {
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-primary:hover {
            background-color: #1d4ed8;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background-color: var(--card-bg);
            color: var(--text-primary);
            border: 1px solid rgba(100, 116, 139, 0.3);
        }

        .btn-secondary:hover {
            background-color: rgba(37, 99, 235, 0.1);
        }

        /* Stats Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid rgba(100, 116, 139, 0.3);
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            border-color: var(--primary-color);
            transform: translateY(-4px);
            box-shadow: 0 12px 24px rgba(37, 99, 235, 0.15);
        }

        .stat-label {
            color: var(--text-secondary);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 32px;
            font-weight: bold;
            color: var(--primary-color);
        }

        /* Tab Content */
        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Kanban Board */
        .kanban-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .kanban-column {
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(100, 116, 139, 0.3);
        }

        .column-header {
            padding: 15px;
            background-color: rgba(37, 99, 235, 0.1);
            border-bottom: 2px solid var(--primary-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .column-header h3 {
            font-size: 14px;
            font-weight: 600;
        }

        .column-count {
            background-color: var(--primary-color);
            color: white;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 12px;
        }

        .column-body {
            padding: 15px;
            flex: 1;
            overflow-y: auto;
            min-height: 400px;
        }

        .task-card {
            background-color: rgba(51, 65, 85, 0.5);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 12px;
            border: 1px solid rgba(100, 116, 139, 0.3);
            cursor: grab;
            transition: all 0.3s ease;
        }

        .task-card:hover {
            border-color: var(--primary-color);
            transform: translateX(-4px);
            box-shadow: 0 8px 16px rgba(37, 99, 235, 0.1);
        }

        .task-card.dragging {
            opacity: 0.5;
            transform: rotate(2deg);
        }

        .task-title {
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .task-meta {
            display: flex;
            gap: 8px;
            font-size: 11px;
            color: var(--text-secondary);
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            max-width: 500px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            font-size: 20px;
        }

        .close-btn {
            background: none;
            border: none;
            color: var(--text-primary);
            font-size: 24px;
            cursor: pointer;
            padding: 0;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            font-weight: 600;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid rgba(100, 116, 139, 0.3);
            border-radius: 8px;
            background-color: rgba(51, 65, 85, 0.5);
            color: var(--text-primary);
            font-family: inherit;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        /* Badge Styles */
        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
        }

        .badge-high { background-color: rgba(220, 38, 38, 0.2); color: #fca5a5; }
        .badge-medium { background-color: rgba(217, 119, 6, 0.2); color: #fdba74; }
        .badge-low { background-color: rgba(34, 197, 94, 0.2); color: #86efac; }

        /* Responsive */
        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }

            .sidebar {
                border-right: none;
                border-bottom: 1px solid rgba(100, 116, 139, 0.3);
                flex-direction: row;
                overflow-x: auto;
                gap: 10px;
                padding: 10px;
            }

            .nav-menu {
                flex-direction: row;
                gap: 10px;
            }

            .kanban-container {
                grid-template-columns: 1fr;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }
        }

        .space-y-4 > * + * {
            margin-top: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">
                <span>📊</span>
                GasTrack
            </div>
            <nav class="nav-menu">
                <button class="nav-tab active" data-tab="dashboard">📈 لوحة التحكم</button>
                <button class="nav-tab" data-tab="kanban">📋 لوحة كانبان</button>
                <button class="nav-tab" data-tab="team">👥 الفريق</button>
                <button class="nav-tab" data-tab="achievements">🏆 الإنجازات</button>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="header">
                <h1>GasTrack - مدير المشاريع</h1>
                <div class="header-actions">
                    <button class="btn-primary" id="openCreateTaskModalBtn">+ مهمة جديدة</button>
                    <button class="btn-secondary" id="themeToggleBtn">🌙 وضع داكن</button>
                </div>
            </div>

            <!-- Dashboard Tab -->
            <div class="tab-content active" id="tab-dashboard">
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-label">الكفاءة الإجمالية</div>
                        <div class="stat-value" id="dashOverallEfficiency">0%</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">إجمالي المهام</div>
                        <div class="stat-value" id="dashTotalTasks">0</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">المهام المكتملة</div>
                        <div class="stat-value" id="dashCompletedTasks">0</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">قيد المراجعة</div>
                        <div class="stat-value" id="dashInProgressTasks">0</div>
                    </div>
                </div>

                <div class="stat-card">
                    <div style="padding: 20px;">
                        <h3 style="margin-bottom: 20px;">توزيع الفئات</h3>
                        <div id="dashCategoryProgressContainer" class="space-y-4"></div>
                    </div>
                </div>

                <div style="margin-top: 30px;">
                    <div class="stat-card">
                        <div style="padding: 20px;">
                            <h3 style="margin-bottom: 20px;">أفضل الأداء</h3>
                            <div id="dashLeaderboardContainer" class="space-y-4"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Kanban Tab -->
            <div class="tab-content" id="tab-kanban">
                <div class="kanban-container">
                    <div class="kanban-column">
                        <div class="column-header">
                            <h3>مهام جديدة</h3>
                            <span class="column-count" id="count-todo">0</span>
                        </div>
                        <div class="column-body kanban-column-body" id="col-todo" data-status="To Do"></div>
                    </div>
                    <div class="kanban-column">
                        <div class="column-header">
                            <h3>قيد التنفيذ</h3>
                            <span class="column-count" id="count-in-progress">0</span>
                        </div>
                        <div class="column-body kanban-column-body" id="col-in-progress" data-status="In Progress"></div>
                    </div>
                    <div class="kanban-column">
                        <div class="column-header">
                            <h3>قيد المراجعة</h3>
                            <span class="column-count" id="count-in-review">0</span>
                        </div>
                        <div class="column-body kanban-column-body" id="col-in-review" data-status="In Review"></div>
                    </div>
                    <div class="kanban-column">
                        <div class="column-header">
                            <h3>مكتملة</h3>
                            <span class="column-count" id="count-done">0</span>
                        </div>
                        <div class="column-body kanban-column-body" id="col-done" data-status="Done"></div>
                    </div>
                </div>
            </div>

            <!-- Team Tab -->
            <div class="tab-content" id="tab-team">
                <div class="stats-grid" id="teamCardsGrid"></div>
            </div>

            <!-- Achievements Tab -->
            <div class="tab-content" id="tab-achievements">
                <div id="achievementHistoryList" class="space-y-4"></div>
            </div>
        </main>
    </div>

    <!-- Create Task Modal -->
    <div class="modal" id="createTaskModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>مهمة جديدة</h2>
                <button class="close-btn" id="closeCreateTaskModalBtn">&times;</button>
            </div>
            <form id="createTaskForm">
                <div class="form-group">
                    <label>عنوان المهمة *</label>
                    <input type="text" id="taskTitleInput" required>
                </div>
                <div class="form-group">
                    <label>الوصف</label>
                    <textarea id="taskDescInput"></textarea>
                </div>
                <div class="form-group">
                    <label>الفئة *</label>
                    <select id="taskCategorySelect" required>
                        <option>Cyber Security</option>
                        <option>AI</option>
                        <option>Training Communication</option>
                        <option>Software</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>المسؤول *</label>
                    <select id="taskAssigneeSelect" required></select>
                </div>
                <div class="form-group">
                    <label>الأولوية</label>
                    <select id="taskPrioritySelect">
                        <option>Low</option>
                        <option>Medium</option>
                        <option>High</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>تاريخ الاستحقاق *</label>
                    <input type="date" id="taskDueDateInput" required>
                </div>
                <div class="form-group">
                    <label>وزن الجودة (1-10)</label>
                    <input type="number" id="taskWeightInput" min="1" max="10" value="5">
                </div>
                <button type="submit" class="btn-primary" style="width: 100%;">إنشاء المهمة</button>
            </form>
        </div>
    </div>

    <!-- Rating Modal -->
    <div class="modal" id="ratingModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>تقييم الجودة</h2>
                <button class="close-btn" id="closeRatingModalBtn">&times;</button>
            </div>
            <form id="ratingForm">
                <div style="padding: 15px; background-color: rgba(37, 99, 235, 0.1); border-radius: 8px; margin-bottom: 20px;">
                    <p style="margin-bottom: 8px;"><strong>المهمة:</strong> <span id="ratingTaskTitle"></span></p>
                    <p style="margin-bottom: 8px;"><strong>المسؤول:</strong> <span id="ratingAssignee"></span></p>
                    <p><strong>وزن الجودة المتوقع:</strong> <span id="ratingWeight"></span></p>
                </div>
                <div class="form-group">
                    <label>تقييم الجودة (1-10) *</label>
                    <input type="number" id="qualityRatingInput" min="1" max="10" value="10" required>
                </div>
                <button type="submit" class="btn-primary" style="width: 100%;">حفظ التقييم</button>
            </form>
        </div>
    </div>

    <!-- Data Configuration -->
    <script>
        const CATEGORIES = {
            'Cyber Security': { color: '#ef4444', badgeBg: 'badge-high' },
            'AI': { color: '#a855f7', badgeBg: 'badge-review' },
            'Training Communication': { color: '#f59e0b', badgeBg: 'badge-medium' },

        };

            { name: 'فاطمة علي', role: 'محلل', email: 'fatima@egas.com', avatar: 'https://i.pravatar.cc/150?img=2' },
            { name: 'محمود حسن', role: 'مطور', email: 'mahmoud@egas.com', avatar: 'https://i.pravatar.cc/150?img=3' }
        ];

        const INITIAL_TASKS = [
            { id: 'GT-101', title: 'تطوير نظام الأمان', description: 'تحسين بروتوكولات الأمان', category: 'Cyber Security', assignee: 'أحمد محمد', priority: 'High', status: 'In Progress', dueDate: '2026-12-31', qualityWeight: 9, rating: null },
            { id: 'GT-102', title: 'بناء نموذج الذكاء الاصطناعي', description: 'تطوير نموذج تعلم الآلة', category: 'AI', assignee: 'فاطمة علي', priority: 'High', status: 'To Do', dueDate: '2026-12-25', qualityWeight: 8, rating: null }
        ];

        const INITIAL_ACHIEVEMENTS = [];
    </script>

    <!-- Application Logic -->
    <script src="app.js"></script>
</body>
</html>
